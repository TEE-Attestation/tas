repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black"]
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: pyrefly-check
        name: pyrefly check
        entry: pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
