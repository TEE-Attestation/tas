# Flask built-ins
#DEBUG: false
#TESTING: false
#SECRET_KEY: "change-me-in-production"
#JSON_SORT_KEYS: false
#JSONIFY_PRETTYPRINT_REGULAR: false
#PROPAGATE_EXCEPTIONS: false
#TRAP_HTTP_EXCEPTIONS: false
#TRAP_BAD_REQUEST_ERRORS: null
#SESSION_COOKIE_NAME: "tas_session"
#MAX_CONTENT_LENGTH: 2097152  # 2 MB; increase for multi-GPU attestation servers

# Server binding (used by app.run)
SERVER_BIND_HOST: "0.0.0.0"
SERVER_PORT: 5000

# TAS settings
#TAS_VERSION: "0.1.0"

# Provide a long random key (>= TAS_API_KEY_MIN_LENGTH)
# TODO remove this hardcoded key and use env var or secret manager in production
# You can generate a suitable key with:
#   import os; print(os.urandom(32).hex())
#TAS_API_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#TAS_API_KEY_MIN_LENGTH: 64
#TAS_NONCE_EXPIRATION_SECONDS: 120

# Redis connection
#TAS_REDIS_HOST: "localhost"
#TAS_REDIS_PORT: 6379
#TAS_REDIS_PASSWORD: "change-me"

# Policy storage backend (`redis` or `postgresql`)
#TAS_POLICY_BACKEND: "redis"
#TAS_POSTGRES_DSN: "postgresql://tas@localhost:5432/tas"

# Policy rollback protection (`none` or `etcd`). See docs/STORAGE_OPERATIONS.md.
#TAS_POLICY_AUTHORIZATION: "none"
#TAS_POLICY_OPERATION_TIMEOUT_SECONDS: 20
#TAS_ETCD_ENDPOINTS:
#  - "https://etcd-1.internal:2379"
#  - "https://etcd-2.internal:2379"
#  - "https://etcd-3.internal:2379"
#TAS_ETCD_CA_FILE: "/etc/tas/etcd/ca.pem"
#TAS_ETCD_USERNAME: "tas"
#TAS_ETCD_PASSWORD: "change-me"
#TAS_ETCD_CERT_FILE: "/etc/tas/etcd/client.pem"
#TAS_ETCD_KEY_FILE: "/etc/tas/etcd/client-key.pem"
#TAS_ETCD_TIMEOUT_SECONDS: 5

# KBM plugin discovery and config
#TAS_PLUGIN_PREFIX: "tas_kbm"
#TAS_KBM_CONFIG_FILE: "./config/thales_ctm/thales_ctm.yaml"

# Verification Policy settings
TAS_POLICY_TRUST: "./certs/policy"
TAS_ENFORCE_SIGNED_POLICIES: true

# Certificate issuance feature (disabled by default until production-ready)
#TAS_CERTIFY_ENABLED: false

# Require the management API key (X-MANAGEMENT-API-KEY) for the TAS-attestation
# endpoint POST /attest/v0/report, used by the operator to verify TAS runs in a
# genuine CVM before trusting it. Off by default so TAS can be attested anonymously.
#TAS_ATTEST_REQUIRE_MANAGEMENT_API_KEY: false

# Global (not per-caller) budget of TAS-attestation reports; only served
# reports count. Report generation is an expensive, serialised firmware request.
#TAS_ATTEST_RATE_LIMIT: "2 per minute"

# configfs-tsm slot (provisioned by tas-tsm-slot.service), the TLS certificate
# bound into the report, and the lock file serialising report generation (keep
# it in a directory only the TAS user can write to).
#TAS_ATTEST_TSM_SLOT: "/sys/kernel/config/tsm/report/tas"
#TAS_ATTEST_TLS_CERT_FILE: "/etc/tas/certs/server.crt"
#TAS_ATTEST_LOCK_FILE: "/var/lib/tas/attest.lock"

# Backend used to verify NVIDIA GPU evidence:
#   "remote" - NVIDIA Remote Attestation Service (NRAS)
#   "local"  - verify locally with nvidia_pytools (RIMs cached in Redis)
#TAS_NVIDIA_GPU_VERIFICATION_MODE: "remote"

# Maximum number of GPU evidence entries accepted per attestation request.
# Raise MAX_CONTENT_LENGTH (and, for the certify flow,
# TAS_CERT_EVIDENCE_DIGEST_MAX_ENTRIES) alongside this for large multi-GPU hosts.
#TAS_GPU_MAX_EVIDENCE_ENTRIES: 16

# Optional nested settings (available under app.config['TAS'])
TAS:
  limits:
    max_nonce_per_minute: 120
  logging:
    level: "INFO"
    file: "./tas.log"