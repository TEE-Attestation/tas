[project]
name = "TAS"
version = "0.1.0-alpha"
requires-python = ">=3.10"

[tool.isort]
profile = "black"
known_third_party = ["sev_pytools", "tdx_pytools"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
# Keep the repo root on sys.path so `from plugins import ...` resolves the same
# way regardless of where pytest is launched (predictable CI, no per-env hacks).
pythonpath = ["."]


[project.optional-dependencies]
# Development/test-only dependencies. Install with: pip install -e ".[dev]"
# `spiffe` (py-spiffe, maintained by HPE) is used purely as a test oracle to
# independently validate that issued leaf certificates are well-formed
# X509-SVIDs. It is NOT a runtime dependency of the service.
dev = [
    "spiffe>=0.3,<0.4",
    "pyrefly==1.4.1",
]

[tool.pyrefly]
python-version = "3.10"          # oldest version we support (requires-python)
preset = "strict"
project-includes = ["tas/types.py"]   # widen as more modules get typed
# GPU support is optional: most contributors don't install nvidia_pytools.
# If it's missing, its imports are treated as Any. If it's installed
# (e.g. in CI), the real types are fully checked.
ignore-missing-imports = ["nvidia_pytools", "nvidia_pytools.*"]
