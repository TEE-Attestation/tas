[project]
name = "TAS"
version = "0.1.0-alpha"
requires-python = ">=3.10"

[tool.isort]
profile = "black"
known_third_party = ["sev_pytools", "tdx_pytools"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
# Keep the repo root on sys.path so `from plugins import ...` resolves the same
# way regardless of where pytest is launched (predictable CI, no per-env hacks).
pythonpath = ["."]


[project.optional-dependencies]
# Development/test-only dependencies. Install with: pip install -e ".[dev]"
# `spiffe` (py-spiffe, maintained by HPE) is used purely as a test oracle to
# independently validate that issued leaf certificates are well-formed
# X509-SVIDs. It is NOT a runtime dependency of the service.
dev = [
    "spiffe>=0.3,<0.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    "types-Deprecated>=1.2.9",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "stubs"
explicit_package_bases = true
files = [
    "tas/types.py",
]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "asn1crypto.*",
    "nvidia_pytools.*",
]
ignore_missing_imports = true
